name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres - evidence.document_chunk.embedding
        # (migration 59e91ab651d2) needs `CREATE EXTENSION vector`, same
        # image infra/docker-compose.yml uses for local dev.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: talvrin
          POSTGRES_PASSWORD: talvrin
          POSTGRES_DB: talvrin
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U talvrin -d talvrin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://talvrin_app:talvrin_app@localhost:5433/talvrin
      ADMIN_DATABASE_URL: postgresql+asyncpg://talvrin:talvrin@localhost:5433/talvrin
      # A genuinely separate database, not just a separate schema - same
      # reasoning as infra/init-db/02-test-database.sql (backend/README.md's
      # "Testing" section): tests/integration/conftest.py's per-test
      # TRUNCATE must never be able to touch the same rows a real DATABASE_URL
      # session (dev or, here, a hypothetically-shared CI run) is using.
      TEST_DATABASE_URL: postgresql+asyncpg://talvrin_app:talvrin_app@localhost:5433/talvrin_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://talvrin:talvrin@localhost:5433/talvrin_test
      REDIS_URL: redis://localhost:6380/0
      # Auth tests never make a real Supabase call — they inject a fake
      # httpx transport (tests/integration/conftest.py) — but Settings()
      # requires these to be present just to construct, so a placeholder is
      # enough here.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      # Docker Compose's docker-entrypoint-initdb.d convention (infra/init-db/)
      # only fires for containers started via `docker run`/compose, not GitHub
      # Actions service containers — so the unprivileged app role that RLS
      # depends on (see alembic/versions/f0477a8fb9fe_..., infra/init-db/01-roles.sql)
      # is created here instead, from the same SQL file, to avoid drift.
      - name: Create app DB role
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://talvrin:talvrin@localhost:5433/talvrin" -v ON_ERROR_STOP=1 -f ../infra/init-db/01-roles.sql

      - name: Create test database
        run: |
          psql "postgresql://talvrin:talvrin@localhost:5433/talvrin" -v ON_ERROR_STOP=1 -f ../infra/init-db/02-test-database.sql

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app alembic tests

      - name: Migrate database
        run: uv run alembic upgrade head

      - name: Migrate test database
        run: uv run alembic upgrade head
        env:
          ADMIN_DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}

      - name: Test
        run: uv run pytest -q
