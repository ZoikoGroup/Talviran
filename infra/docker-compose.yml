services:
  postgres:
    # pgvector/pgvector:pg16 - the pgvector project's own official image,
    # a drop-in replacement for postgres:16 (same Postgres major version,
    # so the existing pgdata volume attaches unchanged) with the `vector`
    # extension available to CREATE EXTENSION - not enabled by default.
    # EVID-001 §12.1's launch retrieval stack needs this for semantic
    # search (P4 E3).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: talvrin
      POSTGRES_PASSWORD: talvrin
      POSTGRES_DB: talvrin
    ports: ["5433:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./init-db:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talvrin -d talvrin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
