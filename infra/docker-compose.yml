services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: talvrin
      POSTGRES_PASSWORD: talvrin
      POSTGRES_DB: talvrin
    ports: ["5433:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./init-db:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talvrin -d talvrin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
